npmRebuild: false
appId: com.mekan.terminal
productName: Mekan Terminal
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - resources/**/*
win:
  sign: false
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
publish:
  provider: github
  owner: MekanYsmos-Software
  repo: mekan-terminal
